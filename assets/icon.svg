<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="hexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Rounded Squircle Background -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="url(#hexGrad)" stroke-width="8"/>

  <!-- Subtle Binary / Circuit Grid Lines -->
  <g stroke="#1e293b" stroke-width="2" opacity="0.7">
    <line x1="96" y1="128" x2="416" y2="128"/>
    <line x1="96" y1="256" x2="416" y2="256"/>
    <line x1="96" y1="384" x2="416" y2="384"/>
    <line x1="128" y1="96" x2="128" y2="416"/>
    <line x1="256" y1="96" x2="256" y2="416"/>
    <line x1="384" y1="96" x2="384" y2="416"/>
  </g>

  <!-- Outer Argon Shield / Hexagon -->
  <polygon points="256,68 418,162 418,350 256,444 94,350 94,162"
           fill="rgba(15, 23, 42, 0.85)"
           stroke="url(#hexGrad)"
           stroke-width="12"
           stroke-linejoin="round"
           filter="url(#glow)"/>

  <!-- Inner Control Flow Graph Nodes & Edges -->
  <g stroke="#00e5ff" stroke-width="5" opacity="0.45">
    <line x1="256" y1="130" x2="165" y2="290"/>
    <line x1="256" y1="130" x2="347" y2="290"/>
    <line x1="165" y1="290" x2="347" y2="290"/>
  </g>

  <!-- Android Antenna Accents at Top of Shield -->
  <line x1="210" y1="115" x2="188" y2="85" stroke="#10b981" stroke-width="8" stroke-linecap="round"/>
  <line x1="302" y1="115" x2="324" y2="85" stroke="#10b981" stroke-width="8" stroke-linecap="round"/>

  <!-- Stylized "Ax" (ArgonDEX) Monogram -->
  <path d="M168 348 L228 164 L258 164 L318 348 M188 286 L298 286"
        fill="none"
        stroke="#ffffff"
        stroke-width="22"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <path d="M308 232 L378 348 M378 232 L308 348"
        fill="none"
        stroke="url(#coreGrad)"
        stroke-width="20"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Glowing Corner Nodes -->
  <circle cx="256" cy="68" r="10" fill="#00e5ff"/>
  <circle cx="418" cy="162" r="10" fill="#3b82f6"/>
  <circle cx="418" cy="350" r="10" fill="#8b5cf6"/>
  <circle cx="256" cy="444" r="10" fill="#00e5ff"/>
  <circle cx="94" cy="350" r="10" fill="#8b5cf6"/>
  <circle cx="94" cy="162" r="10" fill="#3b82f6"/>
</svg>
